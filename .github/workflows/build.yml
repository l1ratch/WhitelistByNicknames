name: Build and Release

on:
  push:
    branches:
      - master

jobs:
  build:
    if: "!contains(github.event.head_commit.message, 'nobuild')" # Пропустить, если сообщение коммита содержит 'nobuild'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 1.8
      uses: actions/setup-java@v3
      with:
        java-version: '1.8'
        distribution: 'adopt'

    - name: Build with Maven
      run: mvn clean package

    - name: Extract version from pom.xml
      id: extract_version
      run: echo "VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_ENV

    - name: Rename JAR file
      run: |
        VERSION="${{ env.VERSION }}"
        mv target/*.jar target/WhitelistByNicknames-${VERSION}.jar

    - name: Create Git tag
      run: |
        TAG="v${{ env.VERSION }}"
        git tag -a "$TAG" -m "Release $TAG"
        git push origin "$TAG"

  release:
    if: "!contains(github.event.head_commit.message, 'nobuild')" # Пропустить, если сообщение коммита содержит 'nobuild'
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 1.8
      uses: actions/setup-java@v3
      with:
        java-version: '1.8'
        distribution: 'adopt'

    - name: Extract version from pom.xml
      id: extract_version
      run: echo "VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_ENV

    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: pluginname-${{ env.VERSION }}.jar
        path: target/WhitelistByNicknames-${{ env.VERSION }}.jar

    - name: Create Release
      uses: actions/create-release@v3
      env:
        GITHUB_TOKEN: ${{ secrets.TOKEN }}
      with:
        tag_name: "v${{ env.VERSION }}"
        release_name: "Release v${{ env.VERSION }}"
        body: ${{ github.event.head_commit.message }}
        draft: false
        prerelease: ${{ contains(github.event.head_commit.message, 'pre-release') }}
        files: target/WhitelistByNicknames-${{ env.VERSION }}.jar
